name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    validate:
        name: Validate
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm run build
            - run: npm test
            - run: npm run build-storybook
            - run: npm pack --dry-run --ignore-scripts
    changeset:
        if: github.event_name == 'pull_request'
        uses: koslibs/configs/.github/workflows/changeset-check.yml@v1.0.0
